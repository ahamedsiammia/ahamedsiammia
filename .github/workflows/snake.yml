name: Generate Snake

on:
  # চাইলে schedule অনুযায়ী auto-run হবে (প্রতিদিন)
  schedule:
    - cron: "0 0 * * *"
  # main branch এ push হলেও চলবে
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a GitHub user contributions grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=purple&color_dots=#39d353,#26a641,#006d32,#0e4429,#161b22

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
